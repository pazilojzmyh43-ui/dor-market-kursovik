{% extends "app/layout.html" %}

{% block content %}
<h2>{{ title }}</h2>
<p>Новый пользователь получит роль менеджера и доступ к заказам клиентов.</p>
<form method="POST">
    {% csrf_token %}
    <p>
        <label for="id_first_name">Имя</label><br />
        <input id="id_first_name" type="text" name="first_name" maxlength="150" />
    </p>
    <p>
        <label for="id_last_name">Фамилия</label><br />
        <input id="id_last_name" type="text" name="last_name" maxlength="150" />
    </p>
    {{ regform.as_p }}
    <button type="submit" class="save btn btn-default">Зарегистрировать менеджера</button>
</form>
{% endblock %}
